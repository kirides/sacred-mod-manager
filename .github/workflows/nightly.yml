name: Nightly

# Builds Gear Mod Manager as Native AOT binaries (Windows x64 and Linux x64) every night and publishes each build as its own pre-release,
# tag "nightly-<sha7>", titled "Nightly - YYYY-MM-DD HH:mm - <sha7>" (UTC). Nightlies are kept, none replaces another. A night without a
# new commit builds nothing. Run it by hand from the Actions tab ("Run workflow"); "force" builds even without new commits and replaces
# the release of the same commit.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even when there are no new commits since the last nightly'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    name: Anything new?
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      sha: ${{ steps.decide.outputs.sha }}
      stamp: ${{ steps.decide.outputs.stamp }}
      tag: ${{ steps.decide.outputs.tag }}
      title: ${{ steps.decide.outputs.title }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: The changelog history is up to date
        shell: bash
        run: python3 tools/make_changelog.py --check || echo "::warning::changelog/history.md is out of date: run python tools/make_changelog.py"

      - name: Compare with the last nightly
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          sha7=${GITHUB_SHA::7}
          tag="nightly-${sha7}"
          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)
          echo "release $tag assets: ${assets:-none (no release for this commit yet)}"
          # build when this commit has no nightly yet, when forced, or when its nightly lacks a platform (a build failed: try again)
          complete=false
          if echo "$assets" | grep -q 'win-x64.zip' && echo "$assets" | grep -q 'linux-x64.AppImage'; then complete=true; fi
          if [ "${{ github.event.inputs.force }}" = "true" ] || [ "$complete" != "true" ]; then build=true; else build=false; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%d)-${sha7}" >> "$GITHUB_OUTPUT"
          echo "title=Nightly - $(date -u '+%Y-%m-%d %H:%M') - ${sha7}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.rid }}
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false   # a failing Linux build must not take the Windows build down (and the other way round)
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Native AOT prerequisites (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\Program Files (x86)\Microsoft Visual Studio\Installer" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH'

      - name: Test
        run: dotnet test --solution SacredModManager.slnx --configuration Release

      - name: Publish (Native AOT, warnings are errors)
        run: >
          dotnet publish src/SacredModManager -c Release -r ${{ matrix.rid }} -o publish
          -p:InformationalVersion=nightly-${{ needs.check.outputs.stamp }}

      - name: Smoke test the published program (headless self test with a local index)
        shell: bash
        run: |
          set -e
          py=python3; command -v python3 >/dev/null || py=python
          index=$($py tools/make_smoke_index.py "$RUNNER_TEMP/smoke")
          if [ "$RUNNER_OS" = "Windows" ]; then exe="publish/Gear Mod Manager.exe"; else exe="publish/Gear Mod Manager"; fi
          "$exe" --selftest "$index"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem publish
          Compress-Archive -Path publish\* -DestinationPath "Gear-Mod-Manager-nightly-${{ matrix.rid }}.zip"

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          set -e
          ls -la publish
          rm -rf AppDir && mkdir -p AppDir/usr/bin
          cp -a publish/. AppDir/usr/bin/
          chmod +x "AppDir/usr/bin/Gear Mod Manager"
          ln -s "Gear Mod Manager" AppDir/usr/bin/gear-mod-manager
          cp src/SacredModManager/Assets/app.png AppDir/gear-mod-manager.png
          ln -s gear-mod-manager.png AppDir/.DirIcon
          cat > AppDir/gear-mod-manager.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Gear Mod Manager
          Comment=Install and manage Sacred Gear mods
          Exec=gear-mod-manager %u
          Icon=gear-mod-manager
          Terminal=false
          Categories=Game;Utility;
          MimeType=x-scheme-handler/gear-mod-manager;
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/Gear Mod Manager" "$@"
          EOF
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # the runners have no FUSE: the tool runs extracted
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "Gear-Mod-Manager-nightly-${{ matrix.rid }}.AppImage"
          chmod +x "Gear-Mod-Manager-nightly-${{ matrix.rid }}.AppImage"
          ls -la *.AppImage

      - name: Smoke test the AppImage
        if: runner.os == 'Linux'
        run: |
          set -e
          index=$(python3 tools/make_smoke_index.py "$RUNNER_TEMP/smoke-appimage")
          "./Gear-Mod-Manager-nightly-${{ matrix.rid }}.AppImage" --appimage-extract-and-run --selftest "$index"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gear-mod-manager-${{ matrix.rid }}
          path: Gear-Mod-Manager-nightly-${{ matrix.rid }}.*
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish the nightly
    needs: [check, build]
    # a platform that failed to build does not cancel the release: whatever was built is published (a cancelled run publishes nothing)
    if: ${{ always() && needs.check.outputs.build == 'true' && contains(fromJSON('["success","failure"]'), needs.build.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the builds
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist
          merge-multiple: true

      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
          TAG: ${{ needs.check.outputs.tag }}
          TITLE: ${{ needs.check.outputs.title }}
        shell: bash
        run: |
          set -e
          mkdir -p dist
          ls -la dist
          [ -n "$(ls -A dist)" ] || { echo "::error::no platform was built, nothing to publish"; exit 1; }
          {
            echo "Automatic build of \`${SHA}\` (times are UTC). Native AOT, no .NET install needed."
            echo
            if ls dist/*win-x64.zip >/dev/null 2>&1; then
              echo '* **Windows x64**: unzip, run `Gear Mod Manager.exe`.'
            else
              echo '* **Windows x64**: the build failed in this run, so there is no Windows download in this nightly.'
            fi
            if ls dist/*linux-x64.AppImage >/dev/null 2>&1; then
              echo '* **Linux x64**: an AppImage: `chmod +x Gear-Mod-Manager-nightly-linux-x64.AppImage`, then run it (without FUSE: `--appimage-extract-and-run`).'
            else
              echo '* **Linux x64**: the build failed in this run, so there is no Linux download in this nightly.'
            fi
            echo
            echo 'Nightly builds are not released versions and can be broken. Each night with new commits gets its own pre-release.'
          } > notes.md
          # only a rebuild of the same commit replaces its release; other nightlies stay
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --prerelease --latest=false \
            --title "$TITLE" --notes-file notes.md
